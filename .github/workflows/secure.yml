name: Security Check Scan

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main, master]
    paths:
      - .github/workflows/secure.yml
  schedule:
    - cron: '21 11 * * *'

permissions:
  contents: read

concurrency:
  group: security-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SEMGREP_VERSION: '1.182.1'
  SEMGREP_RULES_REPO: https://github.com/semgrep/semgrep-rules.git
  SEMGREP_RULES_SHA: 16b9e6d45f10649f6a531ec4838ed9924372c3bc
  MIN_RULES: '200'

jobs:
  guard_whitelist_expiry:
    if: ${{ github.event_name == 'pull_request' }}
    name: checking eta
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      WHITELIST_URL: ${{ secrets.WHITELIST_CALLBACK_URL }}
      WHITELIST_KEY: ${{ secrets.sg_wh_api_key }}
    steps:
      - name: Download complete whitelist
        run: |
          curl -sS --retry 3 --retry-delay 2 --max-time 30 -X POST "$WHITELIST_URL" \
               -H "Content-Type: application/json" \
               -H "X-API-KEY: $WHITELIST_KEY" \
               -d '{"pr_url":""}' \
               -o all.json

      - name: Check for expired entries
        run: |
          TODAY=$(date +%F)
          REPO_FULL="https://github.com/${GITHUB_REPOSITORY}"
          EXPIRED=$(jq -r --arg t "$TODAY" --arg repo "$REPO_FULL" \
            '(.exemptions // []) | map(select(.eta <= $t and (.pr_url | startswith($repo)))) | length' all.json)

          if [ "$EXPIRED" -gt 0 ]; then
            echo "::error ::🔒 $EXPIRED whitelist exemption(s) for this repository (${GITHUB_REPOSITORY}) are past their ETA."
            echo "❌ Please remove or update the expired entries from the whitelist file before merging this PR."
            exit 1
          fi

  sec_checks:
    if: ${{ github.event_name == 'pull_request' }}
    name: Run required verification
    needs: guard_whitelist_expiry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      scan_result: ${{ steps.scan.outputs.result || steps.preflight.outputs.result }}
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      BASE_REF: ${{ github.base_ref }}
      WHITELIST_URL: ${{ secrets.WHITELIST_CALLBACK_URL }}
      WHITELIST_KEY: ${{ secrets.sg_wh_api_key }}
    steps:
      - name: Check whitelist
        id: check_whitelist
        run: |
          curl -sS --retry 3 --retry-delay 2 --max-time 30 -X POST "$WHITELIST_URL" \
               -H "Content-Type: application/json" \
               -H "X-API-KEY: $WHITELIST_KEY" \
               -d "$(jq -n --arg pr "$PR_URL" '{pr_url: $pr}')" \
               -o response.json

          PR_CLEAN=$(echo "$PR_URL" | xargs)

          if jq -e --arg pr "$PR_CLEAN" '.exemptions[]? | select(.pr_url == $pr)' response.json > /dev/null 2>&1; then
            echo "whitelisted=true" >> "$GITHUB_OUTPUT"
            echo "✅ PR is whitelisted. Skipping scan."
          else
            echo "whitelisted=false" >> "$GITHUB_OUTPUT"
            echo "🔍 PR not whitelisted. Proceeding to scan."
          fi

      - name: Checkout code
        if: ${{ steps.check_whitelist.outputs.whitelisted == 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch pinned Semgrep rules
        if: ${{ steps.check_whitelist.outputs.whitelisted == 'false' }}
        run: |
          set -euo pipefail
          rules_repo="$RUNNER_TEMP/semgrep-rules"
          git init -q "$rules_repo"
          git -C "$rules_repo" fetch -q --depth 1 "$SEMGREP_RULES_REPO" "$SEMGREP_RULES_SHA"
          git -C "$rules_repo" checkout -q FETCH_HEAD
          test "$(git -C "$rules_repo" rev-parse HEAD)" = "$SEMGREP_RULES_SHA"
          echo "RULES_DIR=$rules_repo/generic/secrets" >> "$GITHUB_ENV"

      - name: Set up Python
        if: ${{ steps.check_whitelist.outputs.whitelisted == 'false' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'

      - name: Install Semgrep (pinned)
        if: ${{ steps.check_whitelist.outputs.whitelisted == 'false' }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: "semgrep==${SEMGREP_VERSION}"
          test "$(semgrep --version)" = "$SEMGREP_VERSION"

      - name: Verify scanner (rules load and a known fake secret is detected)
        id: preflight
        if: ${{ steps.check_whitelist.outputs.whitelisted == 'false' }}
        run: |
          set -u -o pipefail
          set +e
          fail() {
            echo "result=engine_error" >> "$GITHUB_OUTPUT"
            echo "::error title=Scanner self-check failed::$1"
            exit 1
          }

          rule_count=$(grep -rhE '^\s*-\s+id:' --include='*.yaml' --exclude='*.test.yaml' "$RULES_DIR" | wc -l)
          echo "Pinned rules found: $rule_count (minimum $MIN_RULES)"
          [ "$rule_count" -ge "$MIN_RULES" ] || fail "only $rule_count rules found, expected at least $MIN_RULES"

          canary_dir="$RUNNER_TEMP/canary"
          mkdir -p "$canary_dir"
          printf 'aws_access_key_id = %s%s\n' 'AKIA' 'IOSFODNN7EXAMPLE' > "$canary_dir/canary.txt"
          semgrep scan --config "$RULES_DIR" --error --metrics=off --disable-version-check \
            --output /dev/null --json-output "$RUNNER_TEMP/canary.json" "$canary_dir" \
            > /dev/null 2> "$RUNNER_TEMP/canary.err"
          rc=$?
          detected=$(jq '.results | length' "$RUNNER_TEMP/canary.json" 2>/dev/null || echo 0)
          if [ "$rc" -ne 1 ] || [ "$detected" -lt 1 ]; then
            tail -n 40 "$RUNNER_TEMP/canary.err"
            fail "known fake secret was not detected (exit=$rc, findings=$detected)"
          fi
          echo "Self-check passed: $rule_count rules, canary detected ($detected finding(s))."

      - name: Run diff scan
        id: scan
        if: ${{ steps.check_whitelist.outputs.whitelisted == 'false' }}
        run: |
          set -u -o pipefail
          set +e
          echo "🚀 Diff scan against origin/$BASE_REF (semgrep $SEMGREP_VERSION, rules @ ${SEMGREP_RULES_SHA:0:12})"
          semgrep scan \
            --config "$RULES_DIR" \
            --baseline-commit "origin/$BASE_REF" \
            --error --strict --metrics=off --disable-version-check \
            --output /dev/null --json-output semgrep-results.json \
            2> semgrep-stderr.log
          rc=$?
          cat semgrep-stderr.log

          if [ "$rc" -eq 0 ]; then
            result=clean
          elif [ "$rc" -eq 1 ]; then
            result=findings
          else
            result=engine_error
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

          {
            echo "### Security scan: \`$result\`"
            echo "semgrep \`$SEMGREP_VERSION\`, rules \`${SEMGREP_RULES_SHA:0:12}\`, base \`origin/$BASE_REF\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$result" = "findings" ]; then
            jq -r '.results[] | "::error file=\(.path),line=\(.start.line),title=Possible secret::\(.check_id | sub("^.*semgrep-rules\\."; ""))"' semgrep-results.json
            jq -r '.results[] | "- `\(.check_id | sub("^.*semgrep-rules\\."; ""))` at `\(.path):\(.start.line)`"' semgrep-results.json >> "$GITHUB_STEP_SUMMARY"
          elif [ "$result" = "engine_error" ]; then
            echo "::error title=Scanner error::Semgrep exited with code $rc. This is a scanner failure, not a finding."
          fi

          [ "$rc" -eq 0 ]

  notify_blocked:
    needs: sec_checks
    if: ${{ always() && github.event_name == 'pull_request' && needs.sec_checks.result == 'failure' }}
    name: Notify if blocked
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      REPO: ${{ github.repository }}
      ACTOR: ${{ github.actor }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SCAN_RESULT: ${{ needs.sec_checks.outputs.scan_result }}
    steps:
      - name: Send Slack alert
        run: |
          set -euo pipefail
          bt=$(printf '\140')
          if [ "$SCAN_RESULT" = "findings" ]; then
            text=$(printf ':rotating_light: *Security check failed* <%s|PR #%s> in *%s* (triggered by *%s*).\nIf this is a false positive, run this command:\n\n%s/github-whitelist-pr %s reason:"<reason>" eta:"YYYY-MM-DD" bug:"SEC-1234" tribe:"<t-tribe-name>"%s\nRun: %s' \
              "$PR_URL" "$PR_NUMBER" "$REPO" "$ACTOR" "$bt" "$PR_URL" "$bt" "$RUN_URL")
          else
            text=$(printf ':warning: *Security scanner error (not a finding)* on <%s|PR #%s> in *%s* (triggered by *%s*).\nNo verdict was produced, so this is NOT a false positive. Please re-run once; if it fails again, escalate to Security and do not whitelist.\nResult: %s%s%s  Run: %s' \
              "$PR_URL" "$PR_NUMBER" "$REPO" "$ACTOR" "$bt" "${SCAN_RESULT:-workflow_error}" "$bt" "$RUN_URL")
          fi
          curl -sS --fail --retry 3 --max-time 30 -X POST -H 'Content-Type: application/json' \
               --data "$(jq -n --arg text "$text" '{text: $text}')" \
               "$SLACK_WEBHOOK_URL"

  approve:
    if: ${{ github.event_name == 'pull_request' && needs.sec_checks.result == 'success' }}
    needs: sec_checks
    name: Auto-approve if security check passes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      GH_TOKEN: ${{ secrets.PAT_SECURITYREVIEWUSER }}
    steps:
      - name: Approve PR
        run: gh pr review --approve "$PR_URL"
